[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trainmedic"
version = "0.1.0"
description = "Detect, diagnose, repair and statistically validate silent bugs in PyTorch training code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TrainMedic contributors" }]
keywords = ["pytorch", "debugging", "deep-learning", "program-repair", "invariants", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
stats = ["scipy>=1.9"]
all = ["anthropic>=1.0", "scipy>=1.9"]
dev = ["pytest>=7", "scipy>=1.9"]

[project.scripts]
trainmedic = "trainmedic.cli:main"

[project.urls]
Homepage = "https://github.com/rishikeshwalhekar49-lab/package101"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trainmedic = ["bench/pipelines/*.py", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real training subprocesses (deselect with -m 'not slow')"]
